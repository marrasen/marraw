<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<title>marraw — connect</title>
<style>
  :root {
    --bg: #0c0d0f;
    --panel: #141619;
    --border: #24272c;
    --text: #e6e8eb;
    --muted: #8b9097;
    --accent: #c3c7ff;
    --ok: #5ee0b0;
    --err: #f26d6d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
  header button {
    -webkit-app-region: no-drag;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
  }
  header button:hover { color: var(--text); background: var(--panel); }
  main { flex: 1; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: #3a3f47; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .host { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .status { font-size: 12px; white-space: nowrap; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.wait { color: var(--muted); }
  .iconbtn {
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .iconbtn:hover { color: var(--text); background: var(--bg); }
  .primary, .secondary {
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 7px 12px;
    font: inherit;
    cursor: pointer;
  }
  .primary { background: #2c2f6e; border-color: #3d41a0; color: #fff; }
  .primary:hover { background: #34378a; }
  .secondary { background: var(--panel); color: var(--text); }
  .secondary:hover { border-color: #3a3f47; }
  form.card { display: none; flex-direction: column; gap: 8px; }
  form.card.open { display: flex; }
  label { color: var(--muted); font-size: 12px; }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 7px 10px;
  }
  input[type="text"]:focus { outline: none; border-color: #4c53c9; }
  .mono { font-family: ui-monospace, monospace; }
  .hint { color: var(--muted); font-size: 12px; }
  .formerr { color: var(--err); font-size: 12px; min-height: 16px; }
  footer {
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  footer label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .empty { color: var(--muted); text-align: center; padding: 10px 0; }
</style>
</head>
<body>
  <header>
    <h1>marraw</h1>
    <button id="closeBtn" title="Close">✕</button>
  </header>
  <main>
    <div class="card clickable row" id="localCard">
      <div class="grow">
        <div class="name">This computer</div>
        <div class="host">local library</div>
      </div>
      <span class="status wait">open ›</span>
    </div>
    <div id="remoteList"></div>
    <div class="row">
      <button class="secondary" id="addBtn">Add remote…</button>
    </div>
    <form class="card" id="editForm">
      <label>Name</label>
      <input type="text" id="fName" placeholder="Home desktop" />
      <label>Host (name or IP, optionally :port)</label>
      <input type="text" id="fHost" class="mono" placeholder="100.64.0.12 or desktop:8482" />
      <label>Pairing token (Settings → Remote on the host)</label>
      <input type="text" id="fToken" class="mono" placeholder="32-character token" />
      <div class="formerr" id="fError"></div>
      <div class="row">
        <button type="submit" class="primary">Save</button>
        <button type="button" class="secondary" id="fCancel">Cancel</button>
        <span class="grow"></span>
        <span class="status wait" id="fTest"></span>
      </div>
      <div class="hint">The token is checked when you save.</div>
    </form>
  </main>
  <footer>
    <label><input type="checkbox" id="startupPick" /> Ask at startup</label>
    <span class="hint">Connections are tried live above.</span>
  </footer>
  <script src="./connect.js"></script>
</body>
</html>
