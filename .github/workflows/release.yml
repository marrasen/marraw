name: release

on:
  push:
    tags: ['v*']
  # Build an installer without publishing, to check the pipeline is healthy.
  workflow_dispatch:

# Needed to create the GitHub Release and upload assets to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LIBRAW_VERSION: '0.22.1'
  ORT_VERSION: '1.27.1'
  NODE_VERSION: '24'

jobs:
  # The version gate, on its own so it fails in seconds and all three platform
  # builds can then run in PARALLEL. (They used to chain behind the Windows job
  # so that job could create the draft release alone; the draft is now assembled
  # by the `release` job below, so the chain is gone.)
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A tag whose version disagrees with package.json would publish an
      # installer that electron-updater's latest.yml never points at.
      - name: Check tag matches package.json version
        id: v
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "not a tag: building $pkg without publishing"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$pkg" ]]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

  windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # cgo and the LibRaw build both need MinGW-w64. The runner image ships
      # one, but its location has moved between images -- probe, then fall back
      # to installing it. Entries written to GITHUB_PATH are *prepended*, so
      # this g++ wins over Strawberry Perl's.
      - name: Locate MinGW-w64
        shell: pwsh
        run: |
          $probe = @(
            'C:\msys64\ucrt64\bin'
            'C:\msys64\mingw64\bin'
            'C:\mingw64\bin'
            'C:\ProgramData\mingw64\mingw64\bin'
          )
          $bin = $probe | Where-Object { Test-Path (Join-Path $_ 'g++.exe') } | Select-Object -First 1
          if (-not $bin) {
            Write-Host 'no MinGW on the image; installing'
            choco install mingw --no-progress --yes
            $bin = @(
              'C:\ProgramData\mingw64\mingw64\bin'
              'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
            ) | Where-Object { Test-Path (Join-Path $_ 'g++.exe') } | Select-Object -First 1
          }
          if (-not $bin) { throw 'MinGW-w64 g++ not found' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "using $bin"

      - name: Verify toolchain
        shell: pwsh
        run: |
          g++ --version
          ar --version | Select-Object -First 1
          go env CC CGO_ENABLED

      # libraw.a takes several minutes to compile. setup-libraw.ps1 exits early
      # when the artifact is already present, so a cache hit skips the build.
      - name: Cache LibRaw
        uses: actions/cache@v4
        with:
          path: |
            third_party/libraw
            third_party/LibRaw-${{ env.LIBRAW_VERSION }}.tar.gz
          key: libraw-${{ runner.os }}-${{ env.LIBRAW_VERSION }}-${{ hashFiles('scripts/setup-libraw.ps1') }}

      - name: Build LibRaw
        run: npm run setup:libraw

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}-${{ hashFiles('scripts/setup-ort.ps1') }}

      - name: Fetch ONNX Runtime
        run: npm run setup:ort

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Generate API client
        run: npm run gen

      - name: Typecheck
        run: npm run typecheck

      - name: Vet daemon
        run: go build ./...

      # The Windows job runs no full test suite (no sample RAW here), but the
      # inference runtime must be proven on every platform we ship.
      - name: Test inference runtime
        run: go test ./internal/infer -count=1

      # Build only -- this job never talks to GitHub Releases. The `release`
      # job collects the artifacts and assembles the single draft.
      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: marraw-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml
          if-no-files-found: error

# ---------------------------------------------------------------------------
# macOS and Linux builds are UNTESTED at runtime: no physical test machine.
# CI proves they compile and package; users report whether they run.
#
# All three platform jobs gate on `check` only, so they run in parallel and
# none of them publishes: each just uploads its packages as workflow artifacts.
#
# NOTE: macOS auto-update requires a Developer ID signature -- Squirrel.Mac
# refuses to update an unsigned bundle. The unsigned .dmg installs, but the
# first launch is refused as "damaged" until the user clears the quarantine
# bit (`xattr -dr com.apple.quarantine`); it then never self-updates, and the
# app hides the auto-update toggle on darwin. The Linux AppImage self-updates
# normally. See README Install for the user-facing wording.
# ---------------------------------------------------------------------------

  linux:
    runs-on: ubuntu-22.04 # oldest supported image = oldest glibc users can run
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Cache LibRaw
        uses: actions/cache@v4
        with:
          path: |
            third_party/libraw
            third_party/LibRaw-${{ env.LIBRAW_VERSION }}.tar.gz
          key: libraw-${{ runner.os }}-${{ env.LIBRAW_VERSION }}-${{ hashFiles('scripts/setup-libraw.sh') }}

      - name: Build LibRaw
        run: bash scripts/setup-libraw.sh

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}-${{ hashFiles('scripts/setup-ort.sh') }}

      - name: Fetch ONNX Runtime
        run: bash scripts/setup-ort.sh

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Generate API client
        run: npm run gen

      - name: Vet daemon
        run: go build ./...

      # A CC0 sample RAW (raw.pixls.us) so the libraw tests exercise the real
      # decode pipeline on this otherwise-untested platform instead of skipping.
      # Must be a ~24MP-class file: the cancel/progress/fold-WB tests are
      # calibrated to real-world sizes and fail on small sensors even on
      # Windows (verified with a 12MP ILCE-7S sample).
      - name: Fetch sample RAW
        run: |
          mkdir -p /tmp/marraw-raw
          curl -fsSL --retry 3 -o /tmp/marraw-raw/sample.arw 'https://raw.pixls.us/getfile.php/2414/nice/Sony%20-%20ILCE-7M3%20-%2014bit%2014bit%20compressed%20(3:2).ARW'
          echo '250784580ea527442c09004417bb0eead484f2bf3ee8f9121a776ac65bb50d0f  /tmp/marraw-raw/sample.arw' | shasum -a 256 -c -

      - name: Test daemon
        env:
          MARRAW_TEST_RAW_DIR: /tmp/marraw-raw
        run: go test ./...

      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: marraw-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error

  macos:
    runs-on: macos-15 # arm64 (Apple Silicon) only for now
    needs: check
    env:
      # No signing certificate: stop electron-builder from probing the
      # keychain and stalling or failing on whatever it finds there.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Cache LibRaw
        uses: actions/cache@v4
        with:
          path: |
            third_party/libraw
            third_party/LibRaw-${{ env.LIBRAW_VERSION }}.tar.gz
          key: libraw-${{ runner.os }}-${{ env.LIBRAW_VERSION }}-${{ hashFiles('scripts/setup-libraw.sh') }}

      - name: Build LibRaw
        run: bash scripts/setup-libraw.sh

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}-${{ hashFiles('scripts/setup-ort.sh') }}

      - name: Fetch ONNX Runtime
        run: bash scripts/setup-ort.sh

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Generate API client
        run: npm run gen

      - name: Vet daemon
        run: go build ./...

      # A CC0 sample RAW (raw.pixls.us) so the libraw tests exercise the real
      # decode pipeline on this otherwise-untested platform instead of skipping.
      # Must be a ~24MP-class file: the cancel/progress/fold-WB tests are
      # calibrated to real-world sizes and fail on small sensors even on
      # Windows (verified with a 12MP ILCE-7S sample).
      - name: Fetch sample RAW
        run: |
          mkdir -p /tmp/marraw-raw
          curl -fsSL --retry 3 -o /tmp/marraw-raw/sample.arw 'https://raw.pixls.us/getfile.php/2414/nice/Sony%20-%20ILCE-7M3%20-%2014bit%2014bit%20compressed%20(3:2).ARW'
          echo '250784580ea527442c09004417bb0eead484f2bf3ee8f9121a776ac65bb50d0f  /tmp/marraw-raw/sample.arw' | shasum -a 256 -c -

      - name: Test daemon
        env:
          MARRAW_TEST_RAW_DIR: /tmp/marraw-raw
        run: go test ./...

      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: marraw-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest*.yml
          if-no-files-found: error

# ---------------------------------------------------------------------------
# One writer, one draft. Letting each platform job publish meant three
# concurrent runs of electron-builder's find-or-create-draft logic, and a
# DRAFT release is not retrievable by tag (GET /releases/tags/{tag} only finds
# published ones) -- so "find" is a list-and-match that races. Every release in
# the 0.8.0 cycle came out split across two drafts, in a different shape each
# time, each needing a manual download/delete/re-upload before publishing. A
# split that goes unnoticed ships a release missing latest-linux.yml (no Linux
# auto-update) or the .exe.blockmap (no Windows differential updates).
#
# So the platform jobs now only ever produce artifacts, and this job assembles
# the draft alone. It refuses to create a partial release: the asset list is
# checked against the exact nine files a complete release has.
# ---------------------------------------------------------------------------

  release:
    runs-on: ubuntu-latest
    needs: [check, windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: marraw-*
          merge-multiple: true

      - name: Verify the complete asset set
        run: |
          set -euo pipefail
          cd assets
          expected=(
            "marraw-Setup-${VERSION}.exe"
            "marraw-Setup-${VERSION}.exe.blockmap"
            "latest.yml"
            "marraw-${VERSION}-arm64.dmg"
            "marraw-${VERSION}-arm64.dmg.blockmap"
            "latest-mac.yml"
            "marraw-${VERSION}-x86_64.AppImage"
            "marraw-${VERSION}-amd64.deb"
            "latest-linux.yml"
          )
          echo "found:"; ls -la
          missing=()
          for f in "${expected[@]}"; do
            [[ -s "$f" ]] || missing+=("$f")
          done
          if (( ${#missing[@]} )); then
            printf 'missing or empty asset: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          # And nothing BUT those: the artifacts are the release's source of
          # truth now, so any stray that electron-builder leaves in dist/
          # (builder-debug.yml was one) would otherwise ship as an asset.
          extra=()
          for f in *; do
            for e in "${expected[@]}"; do
              [[ "$f" == "$e" ]] && continue 2
            done
            extra+=("$f")
          done
          if (( ${#extra[@]} )); then
            printf 'unexpected file in the asset set: %s\n' "${extra[@]}" >&2
            exit 1
          fi
          echo "exactly the ${#expected[@]} expected assets are present"

      # --draft: nothing reaches users -- and electron-updater sees nothing --
      # until the release is published. Notes are written at publish time.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out, so gh has no git remote to infer from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists -- refusing to clobber it" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$VERSION" \
            --notes "" \
            assets/*
